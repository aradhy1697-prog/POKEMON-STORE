<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeIndia TCG Store</title>
    <style>
        :root {
            --primary: #ffcb05;
            --secondary: #3c5aa6;
            --accent: #e67e22;
            --bg-black: #000000;
            --text: #ffffff;
            --nm-minus-grad: linear-gradient(45deg, #8e44ad, #ff00ff);
            --nm-grad: #3498db;
        }

        body { font-family: 'Poppins', sans-serif; background: var(--bg-black); color: var(--text); margin: 0; padding: 20px; }
        .header { text-align: center; padding: 40px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .header h1 { color: var(--primary); font-size: 2.5rem; text-transform: uppercase; margin: 0; }

        .nav-buttons { display: flex; justify-content: center; gap: 10px; margin: 30px 0; flex-wrap: wrap; }
        .nav-buttons button { padding: 10px 20px; cursor: pointer; border: 1px solid var(--secondary); border-radius: 20px; background: transparent; color: white; font-weight: bold; }
        .nav-buttons button:hover { background: var(--secondary); }

        .container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; max-width: 1200px; margin: auto; }

        .product { 
            background: rgba(255, 255, 255, 0.05); padding: 20px; border-radius: 15px; 
            text-align: center; border: 1px solid rgba(255, 255, 255, 0.1); display: flex; flex-direction: column; justify-content: space-between;
        }

        /* Condition Badges */
        .badge { padding: 5px 15px; border-radius: 50px; font-size: 0.8rem; font-weight: 800; display: inline-block; margin-bottom: 10px; color: white; }
        .nm-minus { background: var(--nm-minus-grad); animation: pulse 2s infinite; box-shadow: 0 0 10px rgba(255, 0, 255, 0.4); }
        .nm-plain { background: var(--nm-grad); }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }

        .product img { width: 100%; border-radius: 10px; cursor: pointer; height: 250px; object-fit: contain; background: #111; margin-bottom: 15px; }
        .price-tag { font-size: 1.5rem; color: var(--accent); font-weight: bold; margin: 5px 0; }
        .qty-input { width: 60px; background: #222; color: white; border: 1px solid #444; padding: 5px; border-radius: 5px; text-align: center; }

        button.buy { width: 100%; padding: 12px; background: var(--accent); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }

        /* Modal & Zoom */
        #productModal { display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); overflow-y: auto; }
        .modal-content { background: #111; margin: 2% auto; padding: 30px; width: 90%; max-width: 1000px; border-radius: 20px; position: relative; color: white; }
        .close { position: absolute; right: 20px; top: 10px; font-size: 45px; cursor: pointer; }
        .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .modal-grid { grid-template-columns: 1fr; } }

        .zoom-box { width: 100%; height: 500px; overflow: hidden; border-radius: 15px; background: #000; position: relative; cursor: crosshair; }
        .zoom-box img { width: 100%; height: 100%; object-fit: contain; transition: transform 0.1s ease-out; }
        
        .thumb-strip { display: flex; gap: 10px; margin-top: 10px; overflow-x: auto; padding-bottom: 5px; }
        .thumb-strip img { width: 60px; height: 80px; object-fit: cover; border-radius: 5px; cursor: pointer; border: 2px solid transparent; }
        .thumb-strip img.active { border-color: var(--primary); }

        .pagination-container { text-align: center; margin: 40px 0; }
        .next-btn { background: var(--secondary); color: white; border: none; padding: 15px 40px; border-radius: 30px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <button onclick="changeCategory('all')">All Products</button>
    <button onclick="changeCategory('booster')">Booster Boxes</button>
    <button onclick="changeCategory('packs')">Loose Packs</button>
    <button onclick="changeCategory('cards')">Single Cards</button>
</div>

<div class="container" id="productList"></div>

<div class="pagination-container" id="pagination">
    <button class="next-btn" onclick="loadNextPage()">Next Page / Load More</button>
</div>

<div id="productModal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <div id="modalBody" class="modal-grid"></div>
    </div>
</div>

  { name: "Manaphy Holo Diamond & Pearl", price: 900, category: "cards", condition: "NM-", images: ["images/manphy1.jpg", "images/manphy2.jpg"], maxQty: 1 },

  { name: "Urshifu V 158/125 Chinese", price: 900, category: "cards", condition: "NM", images: ["images/urshifu1.jpg"], maxQty: 1 },
  { name: "Mega Pidgeot-EX XY Evolutions", price: 2000, category: "cards", condition: "NM-", images: ["images/megapidgeot.jpg"], maxQty: 1 },
  { name: "Ice Rider Calyrex Sealed Promo", price: 1200, category: "cards", condition: "NM", images: ["images/calyrex.jpg"], maxQty: 1 },
  { name: "Battle Reporter Full Art", price: 2100, category: "cards", condition: "NM-", images: ["images/battlereporter.jpg"], maxQty: 1 },
  { name: "Darkrai Holo Movie Promo JP", price: 1500, category: "cards", condition: "NM-", images: ["images/darkrai.jpg"], maxQty: 1 },
  { name: "Rayquaza GX Tag All Stars JP", price: 849, category: "cards", condition: "NM", images: ["images/rayquaza.jpg"], maxQty: 1 },
  { name: "Genesect EX Plasma Blast Holo", price: 2600, category: "cards", condition: "NM", images: ["images/gensectholo1.jpg", "images/gensectholo2.jpg"], maxQty: 1 }
];

let currentCategory = 'all';
let itemsToShow = 12;
let cart = [];

function loadProducts() {
    let filtered = currentCategory === 'all' ? products : products.filter(p => p.category === currentCategory);
    let displayList = filtered.slice(0, itemsToShow);
    let html = "";

    displayList.forEach((p) => {
        const realIdx = products.indexOf(p);
        const isCard = p.category === 'cards';
        
        let badgeHtml = "";
        if(isCard) {
            badgeHtml = p.condition === "NM-" 
                ? `<div class="badge nm-minus">✨ NM-</div>` 
                : `<div class="badge nm-plain">NM</div>`;
        }

        const stockTag = !isCard ? `<div style="color:#2ecc71; font-size:0.8rem; font-weight:bold;">Stock: ${p.maxQty}</div>` : '';
        const qtyBox = !isCard ? `<input type="number" id="qty-${realIdx}" class="qty-input" value="1" min="1" max="${p.maxQty}">` : '';

        html += `
        <div class="product">
            <div>
                ${badgeHtml}
                <img src="${p.images[0]}" onclick="openProduct(${realIdx})">
                ${stockTag}
                <h4>${p.name}</h4>
                <p class="price-tag">₹${p.price}</p>
                ${qtyBox}
            </div>
            <button class="buy" onclick="addToCart(${realIdx})">Add to Cart</button>
        </div>`;
    });
    document.getElementById("productList").innerHTML = html;
    document.getElementById("pagination").style.display = (itemsToShow >= filtered.length) ? "none" : "block";
}

function openProduct(index) {
    const p = products[index];
    const modal = document.getElementById("productModal");
    const body = document.getElementById("modalBody");
    
    let thumbs = p.images.map((img, i) => `<img src="${img}" onclick="updateModalImg('${img}', this)" class="${i==0?'active':''}">`).join('');

    body.innerHTML = `
        <div>
            <div class="zoom-box" onmousemove="handleZoom(event)" onmouseleave="resetZoom(event)">
                <img src="${p.images[0]}" id="mainModalImg">
            </div>
            <div class="thumb-strip">${thumbs}</div>
        </div>
        <div>
            <h2>${p.name}</h2>
            <p class="price-tag" style="font-size:2.5rem;">₹${p.price}</p>
            <p style="color:#aaa;">Move mouse over image to inspect condition.</p>
            <button class="buy" style="height:50px;" onclick="addToCartModal(${index}); closeModal()">Add to Cart</button>
        </div>
    `;
    modal.style.display = "block";
    document.body.style.overflow = "hidden";
}

function updateModalImg(src, thumb) {
    document.getElementById('mainModalImg').src = src;
    document.querySelectorAll('.thumb-strip img').forEach(t => t.classList.remove('active'));
    thumb.classList.add('active');
}

function handleZoom(e) {
    const box = e.currentTarget;
    const img = box.querySelector('img');
    const x = e.offsetX / box.offsetWidth * 100;
    const y = e.offsetY / box.offsetHeight * 100;
    img.style.transformOrigin = `${x}% ${y}%`;
    img.style.transform = "scale(2.5)";
}

function resetZoom(e) { e.currentTarget.querySelector('img').style.transform = "scale(1)"; }
function closeModal() { document.getElementById("productModal").style.display = "none"; document.body.style.overflow = "auto"; }
function changeCategory(cat) { currentCategory = cat; itemsToShow = 12; loadProducts(); }
function loadNextPage() { itemsToShow += 12; loadProducts(); }

function addToCart(idx) {
    const p = products[idx];
    const input = document.getElementById(`qty-${idx}`);
    let qty = input ? parseInt(input.value) : 1;
    if(qty > p.maxQty) return alert("Not enough stock!");
    for(let i=0; i<qty; i++) cart.push(p);
    renderCart();
}

function addToCartModal(idx) { cart.push(products[idx]); renderCart(); }

function renderCart() {
    let total = cart.reduce((s, i) => s + i.price, 0);
    document.getElementById("cartItems").innerHTML = cart.length === 0 ? "Cart is empty" : 
        cart.map((i, idx) => `<p>✅ ${i.name} - ₹${i.price} <span onclick="remove(${idx})" style="color:red;cursor:pointer;">[X]</span></p>`).join("") + `<hr>Total: ₹${total}`;
}

function remove(idx) { cart.splice(idx, 1); renderCart(); }

function checkout() {
    if(!cart.length) return;
    let text = "PokeIndia Order:\n" + cart.map(i => `- ${i.name}`).join("\n") + "\nTotal: ₹" + cart.reduce((s,i)=>s+i.price,0);
    window.open("https://wa.me/7976132992?text=" + encodeURIComponent(text));
}

loadProducts();
</script>

</html>
