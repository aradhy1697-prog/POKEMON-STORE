<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeIndia TCG Store</title>
    <style>
        :root {
            --primary: #ffcb05;
            --secondary: #3c5aa6;
            --accent: #e67e22;
            --bg-black: #000000;
            --text: #ffffff;
        }

        body { 
            font-family: 'Poppins', sans-serif; 
            background: var(--bg-black) !important;
            color: var(--text);
            margin: 0; padding: 20px; min-height: 100vh;
        }

        .header { text-align: center; padding: 40px; margin-bottom: 40px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .header h1 { color: var(--primary); font-size: 2.5rem; text-transform: uppercase; margin: 0; }
        .header p { color: #888; margin-top: 10px; }

        .nav-buttons { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; }
        .nav-buttons button { padding: 10px 20px; cursor: pointer; border: 1px solid var(--secondary); border-radius: 20px; background: transparent; color: white; transition: 0.3s; font-weight: bold; }
        .nav-buttons button:hover { background: var(--secondary); }

        .container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; max-width: 1200px; margin: auto; }

        .product { 
            background: rgba(255, 255, 255, 0.05); padding: 20px; border-radius: 15px; 
            text-align: center; border: 1px solid rgba(255, 255, 255, 0.1); transition: 0.3s;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .product:hover { border-color: var(--primary); transform: translateY(-5px); background: rgba(255, 255, 255, 0.08); }
        .product img { width: 100%; border-radius: 10px; cursor: pointer; height: 250px; object-fit: contain; background: #111; margin-bottom: 15px; }

        .nm-badge { 
            background: linear-gradient(90deg, #27ae60, #2ecc71); color: white; padding: 4px 12px; border-radius: 50px; 
            font-size: 0.75rem; font-weight: bold; display: inline-block; margin: 0 auto 10px auto;
        }

        .product h4 { font-size: 1rem; margin: 10px 0; height: 40px; overflow: hidden; }
        .price-tag { font-size: 1.5rem; color: var(--accent); font-weight: bold; margin: 10px 0; }
        .stock-tag { color: #888; font-size: 0.8rem; margin-bottom: 10px; }
        
        button.buy { width: 100%; padding: 12px; background: var(--accent); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button.buy:hover { background: #ff9f43; }

        #productModal { display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); overflow-y: auto; }
        .modal-content { 
            background: #111; margin: 5% auto; padding: 30px; width: 90%; max-width: 900px; 
            border-radius: 20px; position: relative; display: flex; flex-wrap: wrap; gap: 30px; border: 1px solid #333;
        }
        .close { position: absolute; right: 20px; top: 10px; font-size: 45px; color: white; cursor: pointer; z-index: 10000; line-height: 1; }
        
        .zoom-box { 
            width: 100%; max-width: 400px; height: 500px; position: relative; 
            overflow: hidden; border-radius: 15px; background: #000; cursor: crosshair;
        }
        #zoom-img { width: 100%; height: 100%; object-fit: contain; transform: scale(1); transition: transform 0.1s ease-out; }

        .cart-section { max-width: 1200px; margin: 40px auto; padding: 30px; background: rgba(255,255,255,0.05); border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); }
        .checkout-btn { background: #25d366; color: white; padding: 18px; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; border: none; font-size: 1.3rem; margin-top: 20px; box-shadow: 0 0 20px rgba(37, 211, 102, 0.2); }
    </style>
</head>
<body>

  { name: "Genesect EX 11/101 Plasma Blast Holo", price: 2600, category: "cards", condition: "NM-", images: ["./images/gensectholo1.jpg", "./images/gensectholo2.jpg"], maxQty: 1 }
];

let cart = [];

function loadProducts(list = products) {
    let html = "";
    list.forEach((p) => {
        let realIdx = products.indexOf(p);
        let isCard = p.category === 'cards';
        let badge = (isCard && p.condition === "NM-") ? `<div class="nm-badge">✨ NM-</div>` : '';
        let stock = (!isCard) ? `<p class="stock-tag">Stock: ${p.maxQty}</p>` : '';
        html += `
        <div class="product">
            <div>
                ${badge}
                <img src="${p.images[0]}" onclick="openProduct(${realIdx})">
                <h4>${p.name}</h4>
                ${stock}
                <p class="price-tag">₹${p.price}</p>
            </div>
            <button class="buy" onclick="addToCart(${realIdx})">Add to Cart</button>
        </div>`;
    });
    document.getElementById("productList").innerHTML = html;
}

function openProduct(index) {
    const p = products[index];
    const modal = document.getElementById("productModal");
    const body = document.getElementById("modalBody");
    
    let badge = (p.category === 'cards' && p.condition === "NM-") ? `<div class="nm-badge">✨ NM-</div>` : '';

    body.innerHTML = `
        <div style="flex:1; min-width:300px; display:flex; flex-direction:column; align-items:center;">
            <div class="zoom-box" onmousemove="doZoom(event)" onmouseleave="stopZoom()">
                <img src="${p.images[0]}" id="zoom-img">
            </div>
            <p style="color:#888; margin-top:10px;">Hover to zoom</p>
        </div>
        <div style="flex:1; min-width:300px; color:white;">
            ${badge}
            <h2 style="margin-top:10px;">${p.name}</h2>
            <p class="price-tag" style="font-size:2.8rem;">₹${p.price}</p>
            <button class="buy" style="height:60px; font-size:1.3rem;" onclick="addToCart(${index}); closeModal()">Add to Cart</button>
        </div>
    `;
    modal.style.display = "block";
    document.body.style.overflow = "hidden";
}

function doZoom(e) {
    const img = document.getElementById("zoom-img");
    const box = e.currentTarget;
    const x = e.offsetX / box.offsetWidth;
    const y = e.offsetY / box.offsetHeight;
    img.style.transformOrigin = `${x * 100}% ${y * 100}%`;
    img.style.transform = "scale(2.5)";
}

function stopZoom() {
    const img = document.getElementById("zoom-img");
    img.style.transform = "scale(1)";
}

function closeModal() {
    document.getElementById("productModal").style.display = "none";
    document.body.style.overflow = "auto";
}

function filterProducts(cat) {
    loadProducts(cat === 'all' ? products : products.filter(p => p.category === cat));
}

function addToCart(idx) {
    cart.push(products[idx]);
    renderCart();
}

function renderCart() {
    let total = cart.reduce((sum, item) => sum + item.price, 0);
    document.getElementById("cartItems").innerHTML = cart.length === 0 ? "Cart is empty" : 
        cart.map(i => `<p>✅ ${i.name} - ₹${i.price}</p>`).join("") + `<hr><b>Total: ₹${total}</b>`;
}

function checkout() {
    if(cart.length === 0) return alert("Your cart is empty!");
    let total = cart.reduce((s, i) => s + i.price, 0);
    let text = "PokeIndia TCG Order Request:\n" + cart.map(i => `- ${i.name}`).join("\n") + "\n\nTotal: ₹" + total;
    window.open("https://wa.me/7976132992?text=" + encodeURIComponent(text));
}

loadProducts();
</script>
