<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P0keIndia TCG Store</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #e63946; --dark: #1d3557; --light: #f1faee; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--light); margin: 0; padding: 20px; color: var(--dark); }
        h1 { text-align: center; color: var(--primary); }
        .store-link { text-align: center; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        .card img { max-width: 100%; height: 200px; object-fit: contain; border-radius: 8px; }
        .price { font-size: 1.2rem; font-weight: bold; color: #2a9d8f; margin: 10px 0; }
        .qty-box { margin: 10px 0; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .qty-box input { width: 50px; padding: 5px; text-align: center; }
        button { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; }
        button:hover { opacity: 0.9; }
        .category-tag { font-size: 0.8rem; text-transform: uppercase; color: #666; }
    </style>
</head>
<body>

    <h1>P0keIndia TCG</h1>
    <div class="store-link">
        <a href="https://take.app/p0keindiatcg" target="_blank">Official Store Link</a>
    </div>

    <div id="products-grid" class="grid">
        </div>

    <script>
        // 1. YOUR SUPABASE CONFIG
        const _supabase = supabase.createClient(
            'https://tyxftjhxzypuugwbvoxf.supabase.co', 
            'YOUR_SUPABASE_ANON_KEY' // <--- PASTE YOUR ACTUAL ANON KEY HERE
        );

        async function loadProducts() {
            const { data: products, error } = await _supabase
                .from('products')
                .select('*')
                .order('category', { ascending: true });

            if (error) {
                console.error("Error loading products:", error);
                return;
            }

            const grid = document.getElementById('products-grid');
            grid.innerHTML = '';

            products.forEach(product => {
                const card = document.createElement('div');
                card.className = 'card';

                // Check if it's a card to hide quantity
                // Assuming categories are named 'booster', 'packs', and 'cards'
                const isSingleCard = product.category === 'cards';

                card.innerHTML = `
                    <img src="${product.image_url || 'https://via.placeholder.com/200'}" alt="${product.name}">
                    <div class="category-tag">${product.category}</div>
                    <h3>${product.name}</h3>
                    <div class="price">₹${product.price}</div>
                    
                    ${!isSingleCard ? `
                        <div class="qty-box">
                            <label>Qty:</label>
                            <input type="number" id="qty-${product.id}" value="1" min="1">
                        </div>
                    ` : '<div style="height:44px;"></div>'} 
                    
                    <button onclick="orderViaWhatsApp('${product.name}', ${product.id}, ${isSingleCard})">
                        Order via WhatsApp
                    </button>
                `;
                grid.appendChild(card);
            });
        }

        function orderViaWhatsApp(name, id, isSingle) {
            let qty = 1;
            if (!isSingle) {
                qty = document.getElementById(`qty-${id}`).value;
            }
            const message = `Hi P0keIndia! I want to order:\n- ${name}\n- Quantity: ${qty}\n\nPlease share Gpay details.`;
            const whatsappUrl = `https://wa.me/91XXXXXXXXXX?text=${encodeURIComponent(message)}`; // <--- CHANGE TO YOUR PHONE NUMBER
            window.open(whatsappUrl, '_blank');
        }

        loadProducts();
    </script>
</body>
</html>
