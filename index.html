<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PokeIndia TCG Store</title>
<style>
  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; color: #333; overflow-x: hidden; }
  header { text-align: center; padding: 30px; background: #ffcb05; color: #3c5aa6; border-radius: 15px; margin-bottom: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
  .filters { text-align: center; margin-bottom: 30px; }
  .filters button { padding: 10px 20px; margin: 5px; cursor: pointer; border: none; background: #3c5aa6; color: white; border-radius: 5px; font-weight: bold; transition: 0.3s; }
  .filters button:hover { background: #2a3f78; transform: translateY(-2px); }
  .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
  .product { background: white; padding: 15px; border-radius: 12px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.05); transition: 0.3s; display: flex; flex-direction: column; justify-content: space-between; }
  .product:hover { transform: translateY(-5px); box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
  .product img { width: 100%; border-radius: 10px; cursor: pointer; margin-bottom: 10px; }
  .buy { background: #e67e22; color: white; border: none; padding: 10px 15px; width: 100%; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; }
  .buy:hover { background: #d35400; }
  #cart { background: white; padding: 20px; border-radius: 15px; margin-top: 40px; box-shadow: 0 -5px 20px rgba(0,0,0,0.05); }
  .checkout-btn { background: #25d366; color: white; border: none; padding: 15px 30px; border-radius: 10px; font-size: 1.1rem; cursor: pointer; font-weight: bold; width: 100%; margin-top: 15px; }
  .modal { display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.9); overflow-y: auto; }
  .modal-content { background-color: #fff; margin: 2% auto; padding: 30px; border-radius: 20px; width: 95%; max-width: 1100px; position: relative; display: flex; flex-direction: row; gap: 40px; align-items: flex-start; }
  .close { position: absolute; right: 20px; top: 15px; color: #333; font-size: 35px; font-weight: bold; cursor: pointer; z-index: 10; }
  .zoom-container { position: relative; width: 500px; height: 700px; overflow: hidden; border-radius: 15px; cursor: zoom-in; background: #f9f9f9; border: 1px solid #ddd; touch-action: none; flex-shrink: 0; }
  #zoom-img { width: 100%; height: 100%; object-fit: contain; transition: transform 0.1s ease-out; transform-origin: center; }
  .nm-badge { background: linear-gradient(45deg, #00b894, #009432); color: white; padding: 12px 25px; border-radius: 50px; font-weight: 900; font-size: 1.2rem; display: inline-block; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0, 184, 148, 0.4); border: 2px solid #fff; }
  @media (max-width: 900px) { .modal-content { flex-direction: column; align-items: center; margin: 5% auto; } .zoom-container { width: 100%; height: 500px; } }
</style>
</head>
<body>
<header>
  <h1>PokeIndia TCG Store</h1>
  <p>Premium Pokémon Cards & Sealed Product</p>
</header>
<div class="filters">
  <button onclick="filterProducts('all')">All Products</button>
  <button onclick="filterProducts('booster')">Booster Boxes</button>
  <button onclick="filterProducts('packs')">Loose Packs</button>
  <button onclick="filterProducts('cards')">Single Cards</button>
</div>
<div id="productList" class="products-grid"></div>
<div id="cart">
  <h3>🛒 Your Shopping Cart</h3>
  <div id="cartItems">Your cart is empty</div>
  <button class="checkout-btn" onclick="checkout()">Checkout on WhatsApp</button>
</div>
<div id="productModal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>
    <div id="modalBody" style="display:flex; width:100%; gap:30px; flex-wrap: wrap;"></div>
  </div>
</div>

<script>
let products = [
  // --- SINGLE CARDS (8 TOTAL - No Qty Box) ---
  { name: "Fire Energy 010 - Cracked Ice Holo", price: 500, category: "cards", condition: "NM", images: ["images/fire.jpg"] },
  { name: "Fighting Energy SVE 014 - Cracked Ice Holo", price: 400, category: "cards", condition: "NM", images: ["images/fighting.jpg"] },
  { name: "Water Energy SVE 011 - Cracked Ice Holo", price: 400, category: "cards", condition: "NM", images: ["images/water.jpg"] },
  { name: "Basic Grass Energy - Cracked Ice Holo", price: 400, category: "cards", condition: "NM", images: ["images/leaf.jpg"] },
  { name: "Basic Psychic Energy 013 - Cracked Ice Holo", price: 400, category: "cards", condition: "NM", images: ["images/psychic.jpg"] },
  { name: "Basic Lightning Energy SVE 012 - Cracked Ice Holo", price: 400, category: "cards", condition: "NM", images: ["images/electric.jpg"] },
  { name: "Basic Darkness Energy SVE 015 - Cracked Ice Holo", price: 400, category: "cards", condition: "NM", images: ["images/dark.jpg"] },
  { name: "Metal Energy SVE 016 - Cracked Ice Holo", price: 400, category: "cards", condition: "NM", images: ["images/metal.jpg"] },

  // --- BOOSTER BOXES (3 TOTAL) ---
  { name: "Paradise Dragona Box (Korean) – SEALED", price: 6000, category: "booster", images: ["images/paradise1.jpg"], maxQty: 1 },
  { name: "White Flare Booster Box (Korean) – SEALED", price: 6500, category: "booster", images: ["images/whiteflare1.jpg"], maxQty: 1 },
  { name: "Korean Lost Abyss Booster Box – SEALED", price: 7500, category: "booster", images: ["images/lostabyss1.jpg"], maxQty: 1 },

  // --- LOOSE PACKS (12 TOTAL - With Qty Box) ---
  { name: "Glory of Team Rocket Pack (Korean)", price: 270, category: "packs", images: ["images/gotr.jpg"], maxQty: 30 },
  { name: "Incandescent Arcana Pack (Japanese)", price: 900, category: "packs", images: ["images/incan.jpg"], maxQty: 20 },
  { name: "Evolving Skies Pack (English)", price: 4000, category: "packs", images: ["images/evolvingsky.jpg"], maxQty: 5 },
  { name: "Crimson Haze Pack (Japanese)", price: 270, category: "packs", images: ["images/crimson.jpg"], maxQty: 30 },
  { name: "Super Electric Breaker Pack (Japanese)", price: 450, category: "packs", images: ["images/electricbreaker.jpg"], maxQty: 30 },
  { name: "Ruler of the Black Flame Pack (Korean)", price: 230, category: "packs", images: ["images/robf.jpg"], maxQty: 30 },
  { name: "Mega Brave Pack (Japanese) – M1L", price: 330, category: "packs", images: ["images/megabrave.jpg"], maxQty: 30 },
  { name: "Pokemon Sword Pack (Japanese) – S1W", price: 1500, category: "packs", images: ["images/swordv.jpg"], maxQty: 30 },
  { name: "2021 McDonald’s 25th Anniv. Pack (English)", price: 1200, category: "packs", images: ["images/mcdonald.jpg"], maxQty: 10 },
  { name: "Gym Promo Pack Vol. 8 (Japanese)", price: 500, category: "packs", images: ["images/gym8.jpg"], maxQty: 10 },
  { name: "Gym Promo Pack Vol. 7 (Japanese)", price: 500, category: "packs", images: ["images/gym7.jpg"], maxQty: 10 },
  { name: "Mask of Change Pack (Korean)", price: 300, category: "packs", images: ["images/mask1.jpg"], maxQty: 30 }
];

let cart = [];
let currentScale = 2.5;

function loadProducts(list = products) {
  let html = "";
  list.forEach((p, i) => {
    let realIndex = products.indexOf(p);
    let isSingleCard = (p.category === 'cards');
    html += `
    <div class="product">
      <img src="${p.images[0]}" onclick="openProduct(${realIndex})">
      <div>
        <h4>${p.name}</h4>
        <p style="font-weight:bold; color:#e67e22;">₹${p.price}</p>
        ${isSingleCard ? 
          `<input type="hidden" id="qty-${realIndex}" value="1">` : 
          `<div style="margin: 10px 0;">
             <input type="number" id="qty-${realIndex}" value="1" min="1" max="${p.maxQty || 99}" style="width:50px; padding:5px;">
           </div>`
        }
      </div>
      <button class="buy" onclick="addToCart(${realIndex})">Add to Cart</button>
    </div>`;
  });
  document.getElementById("productList").innerHTML = html;
}

function filterProducts(cat) { loadProducts(cat === "all" ? products : products.filter(p => p.category === cat)); }

function openProduct(index) {
    const p = products[index];
    const modal = document.getElementById("productModal");
    const content = document.getElementById("modalBody");
    currentScale = 2.5;
    let conditionHTML = p.condition === "NM" ? `<div class="nm-badge">✨ NEAR MINT (NM)</div>` : '';
    content.innerHTML = `
        <div class="zoom-container" onmousemove="zoom(event)" onmouseleave="resetZoom()" onwheel="scrollZoom(event)">
            <img src="${p.images[0]}" id="zoom-img">
        </div>
        <div style="flex:1; padding-top: 10px; min-width: 300px;">
            ${conditionHTML}
            <h2 style="font-size: 2.2rem; color:#2c3e50;">${p.name}</h2>
            <p style="font-size: 2.8rem; color: #e67e22; font-weight: bold; margin: 20px 0;">₹${p.price}</p>
            <button class="buy" style="height: 60px; font-size: 1.4rem;" onclick="addToCart(${index}); closeModal()">Add to Cart</button>
        </div>`;
    modal.style.display = "block";
    document.body.style.overflow = "hidden";
}

function zoom(e) {
    const img = document.getElementById("zoom-img");
    const container = e.currentTarget;
    const x = (e.offsetX / container.offsetWidth) * 100;
    const y = (e.offsetY / container.offsetHeight) * 100;
    img.style.transformOrigin = `${x}% ${y}%`;
    img.style.transform = `scale(${currentScale})`;
}

function scrollZoom(e) {
    e.preventDefault();
    if (e.deltaY < 0) currentScale = Math.min(currentScale + 0.5, 5);
    else currentScale = Math.max(currentScale - 0.5, 1);
    document.getElementById("zoom-img").style.transform = `scale(${currentScale})`;
}

function resetZoom() {
    currentScale = 2.5;
    document.getElementById("zoom-img").style.transform = "scale(1)";
}

function closeModal() {
    document.getElementById("productModal").style.display = "none";
    document.body.style.overflow = "auto";
}

function addToCart(index) {
  const p = products[index];
  const qtyInput = document.getElementById(`qty-${index}`);
  let requestedQty = parseInt(qtyInput.value) || 1;
  
  // Calculate how many are ALREADY in the cart for this item
  let existingInCart = cart
    .filter(item => item.name === p.name)
    .reduce((sum, item) => sum + item.qty, 0);

  let totalPotential = existingInCart + requestedQty;

  // Check against maxQty (if defined)
  if (p.maxQty && totalPotential > p.maxQty) {
    let allowedMore = p.maxQty - existingInCart;
    if (allowedMore <= 0) {
      alert(`⚠️ Sorry! You already have the maximum available (${p.maxQty}) in your cart.`);
    } else {
      alert(`⚠️ Limit reached! You can only add ${allowedMore} more of this item (Max stock: ${p.maxQty}).`);
    }
    qtyInput.value = (allowedMore > 0) ? allowedMore : 1;
    return; // STOP the process here
  }

  // If okay, add to cart
  cart.push({ ...p, qty: requestedQty });
  renderCart();
}
}

function renderCart() {
  let html = ""; let total = 0;
  if(cart.length === 0) html = "Your cart is empty";
  else {
    cart.forEach(item => { total += (item.price * item.qty); html += `<p>✅ ${item.name} (x${item.qty}) - ₹${item.price * item.qty}</p>`; });
    html += `<strong>Total: ₹${total}</strong>`;
  }
  document.getElementById("cartItems").innerHTML = html;
}

function checkout() {
  if(cart.length === 0) return alert("Cart is empty!");
  let text = "Hi PokeIndia! Order Request:\n\n" + cart.map(i => `- ${i.name} (x${i.qty})`).join("\n") + "\n\nTotal: ₹" + cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
  window.open("https://wa.me/7976132992?text=" + encodeURIComponent(text));
}

loadProducts();
</script>
</body>
</html>
