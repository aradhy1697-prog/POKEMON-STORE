<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeIndia TCG Store</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; padding: 20px; }
        .card-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        .card img { max-width: 100%; border-radius: 5px; margin-bottom: 10px; }
        .price { font-size: 1.2em; font-weight: bold; color: #2e7d32; }
    </style>
</head>
<body>
    <h1>PokeIndia TCG Store</h1>
    <div id="store" class="card-container">Loading cards...</div>

    <script>
    // 1. Your Connection Details
    const supabaseUrl = 'https://tyxftjhxzypuugwbvoxf.supabase.co';
    const supabaseKey = 'sb_publishable_nspdcRpIW2QVFP1fc2N13g_U4glBVln';
    
    // 2. The corrected "Wake Up" command for the browser
    const supabase = supabase.createClient(supabaseUrl, supabaseKey);

    async function loadCards() {
        // 3. Look into your 'products' table
        const { data, error } = await supabase.from('products').select('*');
        const storeDiv = document.getElementById('store');
        
        if (error) {
            console.error("Supabase Error:", error);
            storeDiv.innerHTML = "Connection Error: " + error.message;
            return;
        }

        if (!data || data.length === 0) {
            storeDiv.innerHTML = "No cards found in the 'products' table.";
            return;
        }

        // 4. Show the cards
        storeDiv.innerHTML = '';
        data.forEach(card => {
            storeDiv.innerHTML += `
                <div class="card">
                    <img src="${card.image_front || 'https://via.placeholder.com/150'}" alt="${card.name}">
                    <h3>${card.name}</h3>
                    <p class="price">₹${card.price}</p>
                    <button onclick="window.location.href='https://wa.me/91YOUR_NUMBER'">Buy via GPay</button>
                </div>
            `;
        });
    }
    loadCards();
</script>
