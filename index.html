<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeIndia TCG Store</title>
    <style>
        :root {
            --primary: #ffcb05;
            --secondary: #3c5aa6;
            --accent: #e67e22;
            --bg-black: #000000;
            --text: #ffffff;
        }

        body { 
            font-family: 'Poppins', sans-serif; 
            background: var(--bg-black) !important;
            color: var(--text);
            margin: 0; padding: 20px; min-height: 100vh;
        }

        .header { text-align: center; padding: 40px; margin-bottom: 40px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .header h1 { color: var(--primary); font-size: 2.5rem; text-transform: uppercase; margin: 0; }

        .nav-buttons { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; }
        .nav-buttons button { padding: 10px 20px; cursor: pointer; border: 1px solid var(--secondary); border-radius: 20px; background: transparent; color: white; transition: 0.3s; font-weight: bold; }
        .nav-buttons button:hover { background: var(--secondary); }

        .container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; max-width: 1200px; margin: auto; }

        .product { 
            background: rgba(255, 255, 255, 0.05); padding: 20px; border-radius: 15px; 
            text-align: center; border: 1px solid rgba(255, 255, 255, 0.1); transition: 0.3s;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .product:hover { border-color: var(--primary); transform: translateY(-5px); background: rgba(255, 255, 255, 0.08); }
        .product img { width: 100%; border-radius: 10px; cursor: pointer; height: 250px; object-fit: contain; background: #111; margin-bottom: 15px; }

        /* The Badge - Only shows if condition is exactly NM- */
        .nm-badge { 
            background: linear-gradient(90deg, #e67e22, #f39c12); color: white; padding: 4px 12px; border-radius: 50px; 
            font-size: 0.75rem; font-weight: bold; display: inline-block; margin: 0 auto 10px auto;
        }

        .product h4 { font-size: 1rem; margin: 10px 0; height: 40px; overflow: hidden; }
        .price-tag { font-size: 1.5rem; color: var(--accent); font-weight: bold; margin: 10px 0; }
        .qty-input { width: 50px; background: #222; color: white; border: 1px solid #444; padding: 5px; border-radius: 5px; margin-bottom: 10px; }

        button.buy { width: 100%; padding: 12px; background: var(--accent); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button.buy:hover { background: #ff9f43; }

        #productModal { display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); overflow-y: auto; }
        .modal-content { 
            background: #111; margin: 5% auto; padding: 30px; width: 90%; max-width: 900px; 
            border-radius: 20px; position: relative; display: flex; flex-wrap: wrap; gap: 30px; border: 1px solid #333;
        }
        .close { position: absolute; right: 20px; top: 10px; font-size: 45px; color: white; cursor: pointer; z-index: 10000; }
        
        .zoom-box { width: 100%; max-width: 400px; height: 500px; overflow: hidden; border-radius: 15px; background: #000; }
        .zoom-box img { width: 100%; height: 100%; object-fit: contain; transition: transform 0.3s ease; }
        .zoom-box:hover img { transform: scale(1.8); cursor: zoom-in; }

        .cart-section { max-width: 1200px; margin: 40px auto; padding: 30px; background: rgba(255,255,255,0.05); border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); }
        .checkout-btn { background: #25d366; color: white; padding: 18px; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; border: none; font-size: 1.3rem; }
    </style>
</head>
<body>

<div class="header">
    <h1>PokeIndia TCG Store</h1>
</div>

<div class="nav-buttons">
    <button onclick="filterProducts('all')">All Products</button>
    <button onclick="filterProducts('booster')">Booster Boxes</button>
    <button onclick="filterProducts('packs')">Loose Packs</button>
    <button onclick="filterProducts('cards')">Single Cards</button>
</div>

<div class="container" id="productList"></div>

<div id="productModal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <div id="modalBody" style="display: flex; flex-wrap: wrap; gap: 30px; width: 100%;"></div>
    </div>
</div>

<div class="cart-section">
    <h3>🛒 Your Shopping Cart</h3>
    <div id="cartItems">Cart is empty</div>
    <button class="checkout-btn" onclick="checkout()">Checkout via WhatsApp</button>
</div>

<script>
let products = [
  // BOXES
  { name: "Paradise Dragona Box (Korean)", price: 6000, category: "booster", images: ["./images/paradise1.jpg"], maxQty: 1 },
  { name: "White Flare Booster Box (Korean)", price: 6500, category: "booster", images: ["./images/whiteflare1.jpg"], maxQty: 1 },
  { name: "Korean Lost Abyss Booster Box", price: 7500, category: "booster", images: ["./images/lostabyss1.jpg"], maxQty: 1 },
  
  // PACKS
  { name: "Evolving Skies Pack (English)", price: 4000, category: "packs", images: ["./images/evolvingsky.jpg"], maxQty: 2 },
  { name: "151 Pack (Japanese)", price: 650, category: "packs", images: ["./images/151pack.jpg"], maxQty: 10 },
  { name: "Shiny Treasure ex Pack (Japanese)", price: 500, category: "packs", images: ["./images/shinyex.jpg"], maxQty: 10 },
  { name: "Mask of Change Pack (Korean)", price: 300, category: "packs", images: ["./images/mask1.jpg"], maxQty: 12 },
  { name: "Ruler of Black Flame (Korean)", price: 350, category: "packs", images: ["./images/ruler1.jpg"], maxQty: 10 },
  { name: "Wild Force Pack (Korean)", price: 300, category: "packs", images: ["./images/wild1.jpg"], maxQty: 15 },
  { name: "Cyber Judge Pack (Korean)", price: 300, category: "packs", images: ["./images/cyber1.jpg"], maxQty: 15 },
  { name: "Night Wanderer Pack (Korean)", price: 300, category: "packs", images: ["./images/night1.jpg"], maxQty: 20 },
  { name: "Crimson Haze Pack (Korean)", price: 300, category: "packs", images: ["./images/crimson1.jpg"], maxQty: 18 },
  { name: "Ancient Roar Pack (Korean)", price: 300, category: "packs", images: ["./images/ancient1.jpg"], maxQty: 10 },
  { name: "Future Flash Pack (Korean)", price: 300, category: "packs", images: ["./images/future1.jpg"], maxQty: 10 },

  // SINGLE CARDS (Condition Logic Fixed)
  { name: "Manaphy Holo Diamond & Pearl", price: 900, category: "cards", condition: "NM-", images: ["./images/manphy1.jpg"], maxQty: 1 },
  { name: "Arceus Black Star Promo Japanese", price: 600, category: "cards", condition: "NM-", images: ["./images/arceus3.jpg"], maxQty: 1 },
  { name: "Dialga Movie Commemoration Promo", price: 1400, category: "cards", condition: "NM", images: ["./images/dialga2.jpg"], maxQty: 1 },
  { name: "Professor Sada's Vitality", price: 700, category: "cards", condition: "NM", images: ["./images/proff.jpg"], maxQty: 1 },
  { name: "Giratina Holo DP Japanese", price: 1700, category: "cards", condition: "NM", images: ["./images/giratina1.jpg"], maxQty: 1 },
  { name: "Pikachu GG30/GG70 Crown Zenith", price: 2500, category: "cards", condition: "NM", images: ["./images/pika1.jpg"], maxQty: 1 },
  { name: "Night Stretcher SR JP", price: 500, category: "cards", condition: "NM", images: ["./images/stretcher1.jpg"], maxQty: 1 },
  { name: "Mega Pidgeot-EX XY Evolutions", price: 2000, category: "cards", condition: "NM", images: ["./images/megapidgeot.jpg"], maxQty: 1 },
  { name: "Rayquaza GX Tag All Stars JP", price: 849, category: "cards", condition: "NM", images: ["./images/rayquaza.jpg"], maxQty: 1 },
  { name: "Marnie Rainbow Rare Secret", price: 2000, category: "cards", condition: "NM", images: ["./images/marnie1.jpg"], maxQty: 1 }
];

let cart = [];

function loadProducts(list = products) {
    let html = "";
    list.forEach((p) => {
        let realIdx = products.indexOf(p);
        let isCard = p.category === 'cards';
        
        // ONLY SHOW BADGE IF CONDITION IS NM- (NOT NM)
        let badge = (p.condition === "NM-") ? `<div class="nm-badge">✨ NM-</div>` : '';
        
        let qtyBox = (!isCard) ? `<input type="number" id="qty-${realIdx}" class="qty-input" value="1" min="1" max="${p.maxQty}">` : `<input type="hidden" id="qty-${realIdx}" value="1">`;

        html += `
        <div class="product">
            <div>
                ${badge}
                <img src="${p.images[0]}" onclick="openProduct(${realIdx})">
                <h4>${p.name}</h4>
                <p class="price-tag">₹${p.price}</p>
                ${qtyBox}
            </div>
            <button class="buy" onclick="addToCart(${realIdx})">Add to Cart</button>
        </div>`;
    });
    document.getElementById("productList").innerHTML = html;
}

function openProduct(index) {
    const p = products[index];
    const modal = document.getElementById("productModal");
    const body = document.getElementById("modalBody");
    let badge = (p.condition === "NM-") ? `<div class="nm-badge">✨ NM-</div>` : '';

    body.innerHTML = `
        <div style="flex:1; min-width:300px; display:flex; flex-direction:column; align-items:center;">
            <div class="zoom-box"><img src="${p.images[0]}"></div>
        </div>
        <div style="flex:1; min-width:300px; color:white;">
            ${badge}
            <h2 style="margin-top:10px;">${p.name}</h2>
            <p class="price-tag" style="font-size:2.8rem;">₹${p.price}</p>
            <button class="buy" style="height:60px; font-size:1.3rem;" onclick="addToCartModal(${index}); closeModal()">Add to Cart</button>
        </div>
    `;
    modal.style.display = "block";
    document.body.style.overflow = "hidden";
}

function closeModal() {
    document.getElementById("productModal").style.display = "none";
    document.body.style.overflow = "auto";
}

function filterProducts(cat) {
    loadProducts(cat === 'all' ? products : products.filter(p => p.category === cat));
}

function addToCart(idx) {
    let qty = parseInt(document.getElementById(`qty-${idx}`).value);
    for(let i=0; i<qty; i++) { cart.push(products[idx]); }
    renderCart();
}

function addToCartModal(idx) {
    cart.push(products[idx]);
    renderCart();
}

function renderCart() {
    let total = cart.reduce((sum, item) => sum + item.price, 0);
    document.getElementById("cartItems").innerHTML = cart.length === 0 ? "Cart is empty" : 
        cart.map(i => `<p>✅ ${i.name} - ₹${i.price}</p>`).join("") + `<hr><b>Total: ₹${total}</b>`;
}

function checkout() {
    if(cart.length === 0) return alert("Your cart is empty!");
    let total = cart.reduce((s, i) => s + i.price, 0);
    let text = "PokeIndia TCG Order Request:\n" + cart.map(i => `- ${i.name}`).join("\n") + "\n\nTotal: ₹" + total;
    window.open("https://wa.me/7976132992?text=" + encodeURIComponent(text));
}

loadProducts();
</script>
</body>
</html>
