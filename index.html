<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeIndia TCG Store</title>
    <style>
        :root {
            --primary: #ffcb05;
            --secondary: #3c5aa6;
            --accent: #e67e22;
            --bg-black: #000000;
            --text: #ffffff;
        }

        body { 
            font-family: 'Poppins', sans-serif; 
            background: var(--bg-black) !important;
            color: var(--text);
            margin: 0; padding: 20px; min-height: 100vh;
        }

        .header { text-align: center; padding: 40px; margin-bottom: 40px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .header h1 { color: var(--primary); font-size: 2.5rem; text-transform: uppercase; margin: 0; }

        .nav-buttons { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; }
        .nav-buttons button { padding: 10px 20px; cursor: pointer; border: 1px solid var(--secondary); border-radius: 20px; background: transparent; color: white; transition: 0.3s; }
        .nav-buttons button:hover { background: var(--secondary); }

        .container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; max-width: 1200px; margin: auto; }

        .product { 
            background: rgba(255, 255, 255, 0.05); padding: 20px; border-radius: 15px; 
            text-align: center; border: 1px solid rgba(255, 255, 255, 0.1); transition: 0.3s;
        }
        .product:hover { border-color: var(--primary); transform: translateY(-5px); }
        .product img { width: 100%; border-radius: 10px; cursor: pointer; height: 250px; object-fit: contain; background: #111; }

        .nm-badge { 
            background: #27ae60; color: white; padding: 4px 10px; border-radius: 5px; 
            font-size: 0.75rem; font-weight: bold; display: inline-block; margin-bottom: 10px;
        }

        .price-tag { font-size: 1.5rem; color: var(--accent); font-weight: bold; margin: 10px 0; }
        button.buy { width: 100%; padding: 12px; background: var(--accent); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }

        /* --- MODAL & ZOOM FIXES --- */
        #productModal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); overflow-y: auto; }
        .modal-content { 
            background: #111; margin: 2% auto; padding: 30px; width: 90%; max-width: 900px; 
            border-radius: 20px; position: relative; display: flex; flex-wrap: wrap; gap: 20px; border: 1px solid #333;
        }
        .close { position: absolute; right: 20px; top: 10px; font-size: 40px; color: white; cursor: pointer; z-index: 3000; }
        
        .zoom-box { 
            width: 100%; max-width: 400px; height: 500px; position: relative; 
            overflow: hidden; border-radius: 15px; background: #000; cursor: crosshair;
        }
        #zoom-img { width: 100%; height: 100%; object-fit: contain; transform: scale(1); transition: transform 0.1s ease-out; }

        .cart-section { max-width: 1200px; margin: 40px auto; padding: 20px; background: rgba(255,255,255,0.05); border-radius: 15px; }
        .checkout-btn { background: #25d366; color: white; padding: 15px; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; border: none; font-size: 1.2rem; }
    </style>
</head>
<body>

<div class="header">
    <h1>PokeIndia TCG Store</h1>
</div>

<div class="nav-buttons">
    <button onclick="filterProducts('all')">All</button>
    <button onclick="filterProducts('booster')">Booster Boxes</button>
    <button onclick="filterProducts('cards')">Single Cards</button>
</div>

<div class="container" id="productList"></div>

<div id="productModal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <div id="modalBody" style="display: flex; flex-wrap: wrap; gap: 30px; width: 100%;"></div>
    </div>
</div>

<div class="cart-section">
    <h3>🛒 Cart</h3>
    <div id="cartItems">Empty</div>
    <button class="checkout-btn" onclick="checkout()">Checkout via WhatsApp</button>
</div>

<script>
let products = [
  { name: "Pikachu & Zekrom GX Tag Team", price: 2800, category: "cards", condition: "NM-", images: ["./images/pikatag.jpg"], maxQty: 1 },
  { name: "Night Stretcher SR 083/063 JP", price: 500, category: "cards", condition: "NM-", images: ["./images/stretcher1.jpg"], maxQty: 1 },
  { name: "Hoopa EX Legendary Shine JP", price: 1800, category: "cards", condition: "NM-", images: ["./images/hoopa2.jpg"], maxQty: 1 },
  { name: "Paradise Dragona Box (Korean)", price: 6000, category: "booster", images: ["./images/paradise1.jpg"], maxQty: 1 }
  // ... Add your other items here in the same format
];

let cart = [];

function loadProducts(list = products) {
    let html = "";
    list.forEach((p, idx) => {
        let isCard = p.category === 'cards';
        let badge = (isCard && p.condition === "NM-") ? `<div class="nm-badge">✨ NM-</div>` : '';
        html += `
        <div class="product">
            ${badge}
            <img src="${p.images[0]}" onclick="openProduct(${idx})">
            <h4>${p.name}</h4>
            <p class="price-tag">₹${p.price}</p>
            <button class="buy" onclick="addToCart(${idx})">Add to Cart</button>
        </div>`;
    });
    document.getElementById("productList").innerHTML = html;
}

function openProduct(index) {
    const p = products[index];
    const modal = document.getElementById("productModal");
    const body = document.getElementById("modalBody");
    
    let badge = (p.category === 'cards' && p.condition === "NM-") ? `<div class="nm-badge">✨ NM-</div>` : '';

    body.innerHTML = `
        <div style="flex:1; min-width:300px; display:flex; flex-direction:column; align-items:center;">
            <div class="zoom-box" onmousemove="doZoom(event)" onmouseleave="stopZoom()">
                <img src="${p.images[0]}" id="zoom-img">
            </div>
        </div>
        <div style="flex:1; min-width:300px;">
            ${badge}
            <h2 style="color:white;">${p.name}</h2>
            <p class="price-tag" style="font-size:2.5rem;">₹${p.price}</p>
            <button class="buy" style="height:50px;" onclick="addToCart(${index}); closeModal()">Add to Cart</button>
        </div>
    `;
    modal.style.display = "block";
    document.body.style.overflow = "hidden";
}

function doZoom(e) {
    const img = document.getElementById("zoom-img");
    const box = e.currentTarget;
    const x = e.offsetX / box.offsetWidth;
    const y = e.offsetY / box.offsetHeight;
    img.style.transformOrigin = `${x * 100}% ${y * 100}%`;
    img.style.transform = "scale(2.5)";
}

function stopZoom() {
    const img = document.getElementById("zoom-img");
    img.style.transform = "scale(1)";
}

function closeModal() {
    document.getElementById("productModal").style.display = "none";
    document.body.style.overflow = "auto";
}

function filterProducts(cat) {
    loadProducts(cat === 'all' ? products : products.filter(p => p.category === cat));
}

function addToCart(idx) {
    cart.push(products[idx]);
    let total = cart.reduce((sum, item) => sum + item.price, 0);
    document.getElementById("cartItems").innerHTML = cart.map(i => `<p>✅ ${i.name}</p>`).join("") + `<hr><b>Total: ₹${total}</b>`;
}

function checkout() {
    if(cart.length === 0) return alert("Cart is empty");
    let text = "Order Request:\n" + cart.map(i => `- ${i.name}`).join("\n");
    window.open("https://wa.me/7976132992?text=" + encodeURIComponent(text));
}

loadProducts();
</script>
</body>
</html>
