<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeIndia TCG Store</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .header { text-align: center; background: #ffcb05; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 30px; }
        .header h1 { color: #3c5aa6; margin: 0; font-size: 2.5rem; text-shadow: 2px 2px #fff; }
        .nav-buttons { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; }
        .nav-buttons button { padding: 12px 25px; cursor: pointer; border: none; border-radius: 8px; background: #3c5aa6; color: white; font-weight: bold; transition: 0.3s; }
        .nav-buttons button:hover { background: #2a3f78; transform: translateY(-2px); }
        .container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; max-width: 1200px; margin: auto; }
        .product { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 6px 12px rgba(0,0,0,0.08); text-align: center; transition: 0.3s; }
        .product:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.12); }
        .product img { width: 100%; border-radius: 10px; cursor: pointer; object-fit: contain; height: 250px; background: #fafafa; }
        .product h4 { margin: 15px 0 10px; color: #2c3e50; font-size: 1.1rem; height: 50px; overflow: hidden; }
        .stock-tag { background: #eef2ff; color: #3c5aa6; padding: 4px 10px; border-radius: 5px; font-size: 0.8rem; font-weight: bold; display: inline-block; margin-bottom: 10px; }
        .nm-badge { background: #27ae60; color: white; padding: 3px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; margin-bottom: 10px; display: inline-block; }
        button.buy { width: 100%; padding: 12px; background: #e67e22; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button.buy:hover { background: #d35400; }
        
        /* Modal Styles */
        #productModal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); overflow: auto; }
        .modal-content { background: white; margin: 5% auto; padding: 25px; width: 90%; max-width: 900px; border-radius: 20px; display: flex; flex-wrap: wrap; gap: 30px; position: relative; }
        .close { position: absolute; right: 20px; top: 10px; font-size: 35px; cursor: pointer; color: #7f8c8d; }
        .zoom-container { width: 100%; max-width: 450px; height: 550px; overflow: hidden; border-radius: 15px; position: relative; background: #f9f9f9; border: 1px solid #ddd; }
        #zoom-img { width: 100%; height: 100%; object-fit: contain; transition: transform 0.1s ease-out; cursor: zoom-in; }
        
        /* Cart Styles */
        .cart-section { max-width: 1200px; margin: 40px auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .checkout-btn { background: #25d366; color: white; padding: 15px 30px; border: none; border-radius: 10px; font-size: 1.2rem; cursor: pointer; width: 100%; font-weight: bold; margin-top: 20px; }
    </style>
</head>

  { name: "Glory of Team Rocket Pack (Korean)", price: 270, category: "packs", images: ["./images/gotr.jpg"], maxQty: 2 },
  { name: "Incandescent Arcana Pack (Japanese)", price: 900, category: "packs", images: ["./images/incan.jpg"], maxQty: 2 },
  { name: "Evolving Skies Pack (English)", price: 4000, category: "packs", images: ["./images/evolvingsky.jpg"], maxQty: 1 },
  { name: "Crimson Haze Pack (Japanese)", price: 270, category: "packs", images: ["./images/crimson.jpg"], maxQty: 1 },
  { name: "Super Electric Breaker Pack (Japanese)", price: 450, category: "packs", images: ["./images/electricbreaker.jpg"], maxQty: 1 },
  { name: "Ruler of the Black Flame Pack (Korean)", price: 230, category: "packs", images: ["./images/robf.jpg"], maxQty: 1 },
  { name: "Mega Brave Pack (Japanese)", price: 330, category: "packs", images: ["./images/megabrave.jpg"], maxQty: 3 },
  { name: "Pokemon Sword Pack (Japanese)", price: 1500, category: "packs", images: ["./images/swordv.jpg"], maxQty: 3 },
  { name: "Gym Promo Pack Vol. 8 (Japanese)", price: 500, category: "packs", images: ["./images/gym8.jpg"], maxQty: 1 },
  { name: "Mask of Change Pack (Korean)", price: 300, category: "packs", images: ["./images/mask1.jpg"], maxQty: 12 }
];

let cart = [];
let currentScale = 2.5;
let currentImgIndex = 0;

function loadProducts(list = products) {
    let html = "";
    list.forEach((p) => {
        let realIndex = products.indexOf(p);
        let isSingleCard = (p.category === 'cards');
        html += `
        <div class="product">
            <img src="${p.images[0]}" loading="lazy" onclick="openProduct(${realIndex})">
            <div>
                <h4>${p.name}</h4>
                ${p.condition === 'NM' ? '<div class="nm-badge">✨ NM</div><br>' : ''}
                ${!isSingleCard ? `<div class="stock-tag">Stock: ${p.maxQty}</div>` : ''}
                <p style="font-weight:bold; color:#e67e22;">₹${p.price}</p>
                ${isSingleCard ? 
                    `<input type="hidden" id="qty-${realIndex}" value="1">` : 
                    `<div style="margin: 10px 0;">
                        Qty: <input type="number" id="qty-${realIndex}" value="1" min="1" max="${p.maxQty}" 
                        oninput="if(this.value > ${p.maxQty}) this.value = ${p.maxQty}; if(this.value < 1) this.value = 1;"
                        style="width:50px; padding:5px;">
                     </div>`
                }
            </div>
            <button class="buy" onclick="addToCart(${realIndex})">Add to Cart</button>
        </div>`;
    });
    document.getElementById("productList").innerHTML = html;
}

function filterProducts(cat) { loadProducts(cat === "all" ? products : products.filter(p => p.category === cat)); }

function openProduct(index) {
    const p = products[index];
    const modal = document.getElementById("productModal");
    const content = document.getElementById("modalBody");
    currentImgIndex = 0;
    currentScale = 2.5;

    let conditionHTML = p.condition === "NM" ? `<div class="nm-badge">✨ NEAR MINT (NM)</div>` : '';
    let stockDisplay = (p.category !== 'cards') ? `<p style="color:#7f8c8d;"><b>Available Stock:</b> ${p.maxQty}</p>` : '';
    
    let navButtons = p.images.length > 1 ? `
        <div style="margin: 15px 0; display:flex; gap:15px; justify-content:center;">
            <button onclick="changeModalImg(${index}, -1)" style="padding:10px 20px; cursor:pointer; background:#3c5aa6; color:white; border:none; border-radius:8px; font-weight:bold;">◀ Prev</button>
            <button onclick="changeModalImg(${index}, 1)" style="padding:10px 20px; cursor:pointer; background:#3c5aa6; color:white; border:none; border-radius:8px; font-weight:bold;">Next ▶</button>
        </div>` : '';

    content.innerHTML = `
        <div style="display:flex; flex-direction:column; align-items:center; flex:1; min-width:300px;">
            <div class="zoom-container" onmousemove="zoom(event)" onmouseleave="resetZoom()" onwheel="scrollZoom(event)">
                <img src="${p.images[0]}" id="zoom-img">
            </div>
            ${navButtons}
        </div>
        <div style="flex:1; padding-top: 10px; min-width: 300px;">
            ${conditionHTML}
            <h2 style="font-size: 2.2rem; color:#2c3e50;">${p.name}</h2>
            ${stockDisplay}
            <p style="font-size: 2.8rem; color: #e67e22; font-weight: bold; margin: 20px 0;">₹${p.price}</p>
            <button class="buy" style="height: 60px; font-size: 1.4rem;" onclick="addToCart(${index}); closeModal()">Add to Cart</button>
        </div>`;
    modal.style.display = "block";
    document.body.style.overflow = "hidden";
}

function changeModalImg(productIndex, step) {
    const p = products[productIndex];
    currentImgIndex = (currentImgIndex + step + p.images.length) % p.images.length;
    document.getElementById("zoom-img").src = p.images[currentImgIndex];
    resetZoom();
}

function zoom(e) {
    const img = document.getElementById("zoom-img");
    const container = e.currentTarget;
    const x = (e.offsetX / container.offsetWidth) * 100;
    const y = (e.offsetY / container.offsetHeight) * 100;
    img.style.transformOrigin = `${x}% ${y}%`;
    img.style.transform = `scale(${currentScale})`;
}

function scrollZoom(e) {
    e.preventDefault();
    if (e.deltaY < 0) currentScale = Math.min(currentScale + 0.5, 5);
    else currentScale = Math.max(currentScale - 0.5, 1);
    document.getElementById("zoom-img").style.transform = `scale(${currentScale})`;
}

function resetZoom() {
    currentScale = 2.5;
    document.getElementById("zoom-img").style.transform = "scale(1)";
}

function closeModal() {
    document.getElementById("productModal").style.display = "none";
    document.body.style.overflow = "auto";
}

function addToCart(index) {
    const p = products[index];
    const qtyInput = document.getElementById(`qty-${index}`);
    let requestedQty = parseInt(qtyInput.value) || 1;
    cart.push({ ...p, qty: requestedQty });
    renderCart();
}

function renderCart() {
    let html = ""; let total = 0;
    if(cart.length === 0) html = "Your cart is empty";
    else {
        cart.forEach((item, idx) => {
            total += (item.price * item.qty);
            html += `<p>✅ ${item.name} (x${item.qty}) - ₹${item.price * item.qty}</p>`;
        });
        html += `<strong>Total Amount: ₹${total}</strong>`;
    }
    document.getElementById("cartItems").innerHTML = html;
}

function checkout() {
    if(cart.length === 0) return alert("Cart is empty!");
    let total = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
    let text = "Hi PokeIndia! I want to order:\n\n" + cart.map(i => `- ${i.name} (x${i.qty})`).join("\n") + "\n\nTotal: ₹" + total + "\n\nPlease share GPay details.";
    window.open("https://wa.me/7976132992?text=" + encodeURIComponent(text));
}

loadProducts();
</script>
