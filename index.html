function addToCartRip(index) {

function addToCart(index) {
    const p = products[index];
    const qInput = document.getElementById(`qty-${index}`);
    const q = qInput ? parseInt(qInput.value) : 1;
    for(let i=0; i<q; i++) cart.push({...p});
    document.getElementById("cartCount").innerText = cart.length;
}

function toggleCart() {
    const modal = document.getElementById("cartModal");
    const list = document.getElementById("cartList");
    const total = document.getElementById("cartTotal");
    if(cart.length === 0) { list.innerHTML = "Empty"; total.innerHTML = ""; }
    else {
        list.innerHTML = cart.map((item, i) => `<div class="cart-item"><span>${item.name}</span><span>₹${item.price} <button onclick="removeFromCart(${i})" style="color:red; background:none; border:none; cursor:pointer;">[X]</button></span></div>`).join('');
        const sub = cart.reduce((a, b) => a + b.price, 0);
        total.innerHTML = `<p style="color:#00f3ff">Prepaid Total: ₹${sub + 150}</p><p style="color:#ffcb05">COD Total: ₹${sub + 250}</p>`;
    }
    modal.style.display = modal.style.display === "block" ? "none" : "block";
}

function removeFromCart(i) { cart.splice(i, 1); document.getElementById("cartCount").innerText = cart.length; toggleCart(); toggleCart(); }
function closeModal() { document.getElementById("productModal").style.display = "none"; document.body.style.overflow = "auto"; }
function changeCategory(cat) { currentCategory = cat; render(); }
    let currentCategory = "all";
let cart = [];
function handleZoom(e) {
    const box = e.currentTarget;
    const img = box.querySelector('img');
    const rect = box.getBoundingClientRect();
    const x = ((e.clientX - rect.left) / rect.width) * 100;
    const y = ((e.clientY - rect.top) / rect.height) * 100;
    img.style.transformOrigin = `${x}% ${y}%`;
    img.style.transform = "scale(2.5)";
}
function resetZoom(e) { e.currentTarget.querySelector('img').style.transform = "scale(1)"; }
function render() {

    const container = document.getElementById("productContainer");
console.log("RENDER PRODUCTS:", products);

    if (currentCategory !== "all") {
        filtered = filtered.filter(p => p.category === currentCategory);
    }

    if (stockFilter === "in-stock") {
        filtered = filtered.filter(p => !p.soldOut);
    }

    if (stockFilter === "out-of-stock") {
        filtered = filtered.filter(p => p.soldOut);
    }

>

                ${p.soldOut ? `
                <div class="sold-overlay">
                    <div class="sold-banner">SOLD OUT</div>
                </div>
                ` : ""}

            </div>

            <h3>${p.name}</h3>

            <div class="price-tag">₹${p.price}</div>

            ${
                p.soldOut
                ? `<button class="buy" disabled style="opacity:0.5;">Out of Stock</button>`
                : `<button class="buy" onclick="addToCart(${products.indexOf(p)})">Add to Cart</button>`
            }

        </div>
    `).join("");
}
function checkout() {
    if(cart.length === 0) return;
    const sub = cart.reduce((a, b) => a + b.price, 0);
    const msg = `Hi PokeIndia, I want to order:\n${cart.map(i => `- ${i.name}`).join("\n")}\n\nPrepaid Total: ₹${sub+150}\nCOD Total: ₹${sub+250}\n\nPlease share payment details!`;
    window.open("https://wa.me/7976132992?text=" + encodeURIComponent(msg));
}
function applyFilters() {
    render();
}
render();
</script>
