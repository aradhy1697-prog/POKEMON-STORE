<!DOCTYPE html>
<html>
<head>
    <title>Pokémon Store India</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: Arial, sans-serif; background: #f5f7fb; margin: 0; padding-bottom: 50px; }
        header { background: linear-gradient(90deg, #ffcb05, #ff3c3c); color: black; text-align: center; padding: 20px; font-size: 26px; font-weight: bold; }
        nav { display: flex; justify-content: center; gap: 10px; background: white; padding: 10px; position: sticky; top: 0; z-index: 100; }
        nav button { border: none; padding: 8px 12px; border-radius: 20px; background: #ffcb05; cursor: pointer; font-weight: bold; }
        .products { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; padding: 20px; }
        .product { background: white; border-radius: 15px; padding: 15px; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.08); }
        .product img { width: 100%; height: 200px; object-fit: contain; border-radius: 10px; }
        .thumbs { display: flex; justify-content: center; gap: 5px; margin-top: 10px; }
        .thumbs img { width: 40px; height: 40px; cursor: pointer; border: 1px solid #ddd; border-radius: 5px; }
        button.buy { margin-top: 10px; width: 100%; padding: 12px; background: #ff3c3c; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .cart { background: white; margin: 20px; padding: 20px; border-radius: 12px; border: 2px solid #ffcb05; }
    </style>
</head>
<body>

<header>🔥 Pokémon Store India</header>

<nav>
    <button onclick="filterProducts('all')">All</button>
    <button onclick="filterProducts('booster')">Booster Boxes</button>
    <button onclick="filterProducts('packs')">Loose Packs</button>
    <button onclick="filterProducts('cards')">Cards</button>
    <button onclick="filterProducts('accessories')">Accessories</button>
</nav>

<div class="products" id="productList"></div>

<div class="cart">
    <h3>🛒 Your Cart</h3>
    <div id="cartItems">Your cart is empty</div>
    <hr>
    <button onclick="checkout()" class="buy">Checkout on WhatsApp</button>
</div>

<script>
let products = [
  { name: "Paradise Dragona Booster Box (Korean) – S12a SEALED", price: 6000, category: "booster", images: ["images/paradise1.jpg"], maxQty: 1 },
  { name: "Pokémon TCG: White Flare Booster Box (Korean) – S11a SEALED", price: 6500, category: "booster", images: ["images/whiteflare1.jpg"], maxQty: 1 },
  { name: "Korean Lost Abyss Booster Box (S11) SEALED", price: 7500, category: "booster", images: ["images/lostabyss1.jpg"], maxQty: 1 },
  { name: "Glory of Team Rocket Booster Pack (Korean) – SV10", price: 270, category: "packs", images: ["images/gotr.jpg"], maxQty: 2 },
  { name: "Incandescent Arcana Booster Pack – Japanese (S11a)", price: 900, category: "packs", images: ["images/incan.jpg"], maxQty: 2 },
  { name: "Mega Brave Booster Pack – Japanese (M1L)", price: 330, category: "packs", images: ["images/megabrave.jpg"], maxQty: 3 },
  { name: "Pokemon Sword Booster Pack - Japanese (S1W)", price: 1500, category: "packs", images: ["images/swordv.jpg"], maxQty: 3 },
  { name: "Crimson Haze Booster Pack – Japanese (SV5a)", price: 270, category: "packs", images: ["images/crimson.jpg"], maxQty: 1 },
  { name: "Evolving Skies Booster Pack – English (Sword & Shield)", price: 4000, category: "packs", images: ["images/evolvingsky.jpg"], maxQty: 1 },
  { name: "2021 McDonald’s 25th Anniversary Pokémon Pack (English Promo)", price: 1200, category: "packs", images: ["images/mcdonald.jpg"], maxQty: 1 },
  { name: "Gym Promo Pack Vol. 8 – Japanese (Scarlet & Violet)", price: 500, category: "packs", images: ["images/gym8.jpg"], maxQty: 1 },
  { name: "Gym Promo Pack Vol. 7 – Japanese (Scarlet & Violet)", price: 500, category: "packs", images: ["images/gym7.jpg"], maxQty: 1 },
  { name: "Super Electric Breaker Booster Pack – Japanese (SV8)", price: 450, category: "packs", images: ["images/electricbreaker.jpg"], maxQty: 1 },
  { name: "Ruler of the Black Flame - Korean (SV3)", price: 230, category: "packs", images: ["images/robf.jpg"], maxQty: 1 },
  { name: "Mask of Change Booster Pack – Korean (SV6)", price: 300, category: "packs", images: ["images/mask1.jpg"], maxQty: 12 }
];

let cart = [];

function loadProducts(list = products) {
  let html = "";
  list.forEach((p, i) => {
    let isStackable = (p.category === 'packs' || p.category === 'accessories');
    let realIndex = products.indexOf(p);
    html += `
    <div class="product">
      <img src="${p.images[0]}" style="width:100%; border-radius:10px;">
      <h4>${p.name}</h4>
      <p style="font-weight:bold; color:#e67e22;">₹${p.price} ${isStackable ? 'per pack' : ''}</p>
      ${isStackable ? `
        <div style="margin: 10px 0;">
          <label style="font-size:12px;">Qty (Max: ${p.maxQty}):</label><br>
          <input type="number" id="qty-${realIndex}" value="1" min="1" max="${p.maxQty}" style="width:80%; padding:8px; border:2px solid #ffcb05; border-radius:5px;">
        </div>` : `<input type="hidden" id="qty-${realIndex}" value="1">`}
      <button class="buy" onclick="addToCart(${realIndex})">Add to Cart</button>
    </div>`;
  });
  document.getElementById("productList").innerHTML = html;
}

function filterProducts(cat) { loadProducts(cat === "all" ? products : products.filter(p => p.category === cat)); }

function addToCart(index) {
  const qtyInput = document.getElementById(`qty-${index}`);
  let q = parseInt(qtyInput.value) || 1;
  const max = products[index].maxQty;

  // Security Check: If they typed a number higher than your stock
  if (q > max) {
    alert(`Sorry! We only have ${max} of this item in stock. Setting quantity to ${max}.`);
    q = max;
    qtyInput.value = max; // This physically changes the number in the box back to the limit
  }
  
  if (q < 1) q = 1; // Prevents negative numbers or zero

  cart.push({ ...products[index], qty: q });
  renderCart();
}

function clearCart() { cart = []; renderCart(); }

function renderCart() {
  let html = ""; let total = 0;
  if(cart.length === 0) html = "Your cart is empty";
  else {
    cart.forEach(item => {
      let sub = item.price * item.qty;
      html += `<p>✅ ${item.name} (x${item.qty}) - ₹${sub}</p>`;
      total += sub;
    });
    html += `<strong>Total: ₹${total}</strong><br><button onclick="clearCart()" style="background:#ccc; color:#000; padding:5px; margin-top:5px; border:none; border-radius:5px; cursor:pointer;">Clear Cart</button>`;
  }
  document.getElementById("cartItems").innerHTML = html;
}

function checkout() {
  if(cart.length === 0) return alert("Cart is empty!");
  let text = "Hi PokeIndia! I want to order:\n\n" + cart.map(i => `- ${i.name} (x${i.qty}) - ₹${i.price * i.qty}`).join("\n") + "\n\nTotal: ₹" + cart.reduce((sum, i) => sum + (i.price * i.qty), 0) + "\n\nPlease send GPay info!";
  window.open("https://wa.me/7976132992?text=" + encodeURIComponent(text));
}

loadProducts();
</script>
