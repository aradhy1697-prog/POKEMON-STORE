<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeIndia TCG Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #ffcb05;
            --secondary: #3c5aa6;
            --neon-price: #39ff14;
            --neon-btn: #00f3ff;
            --bg-black: #050505;
            --text: #ffffff;
            --nm-minus-grad: linear-gradient(45deg, #8e44ad, #ff00ff);
            --nm-plain: #3498db;
            --neon-blue: #00f3ff;
        }

        body { font-family: 'Poppins', sans-serif; background: var(--bg-black); color: var(--text); margin: 0; padding: 20px; overflow-x: hidden; }
        
        /* HEADER GLITCH */
        .header { text-align: center; padding: 60px 20px 20px 20px; }
        .header h1 {
            font-size: 3.5rem; font-weight: 900; text-transform: uppercase;
            font-family: 'Orbitron', sans-serif; color: #fff;
            text-shadow: 0 0 10px var(--neon-blue), 0 0 20px var(--neon-blue);
            margin: 0; animation: glitch 3s infinite;
        }
        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); text-shadow: 2px 0 #ff00c1, -2px 0 #00fff9; }
            25% { transform: translate(0); }
            100% { transform: translate(0); }
        }

        /* COD BAR */
        .cod-bar {
            background: linear-gradient(90deg, #ffcb05, #ff8800); color: black;
            text-align: center; padding: 10px; font-weight: bold; font-family: 'Orbitron';
            text-transform: uppercase; position: sticky; top: 0; z-index: 1001;
        }

        /* CART ICON */
        .cart-icon-container {
            position: fixed; top: 80px; right: 20px; z-index: 1000;
            cursor: pointer; background: rgba(255, 255, 255, 0.1); padding: 15px;
            border-radius: 50%; border: 1px solid var(--neon-btn); backdrop-filter: blur(10px);
            box-shadow: 0 0 15px var(--neon-btn); display: flex;
        }
        .cart-count {
            position: absolute; top: 0; right: 0; background: #ff0000;
            color: white; border-radius: 50%; padding: 2px 8px; font-size: 0.8rem;
        }

        /* NAVIGATION */
        .nav-buttons { display: flex; justify-content: center; gap: 15px; margin-bottom: 40px; flex-wrap: wrap; }
        .nav-buttons button { 
            padding: 10px 25px; cursor: pointer; border: 2px solid var(--neon-btn); 
            background: transparent; color: var(--neon-btn); font-family: 'Orbitron'; transition: 0.3s;
        }
        .nav-buttons button:hover { background: var(--neon-btn); color: black; box-shadow: 0 0 20px var(--neon-btn); }

        /* PRODUCT GRID */
        .container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; max-width: 1200px; margin: auto; }
        .product { background: #111; padding: 20px; border-radius: 15px; text-align: center; border: 1px solid rgba(255, 255, 255, 0.05); }
        .product img { width: 100%; height: 260px; object-fit: contain; border-radius: 10px; cursor: pointer; background: #000; }
        .price-tag { font-family: 'Orbitron'; font-size: 1.6rem; color: var(--neon-price); margin: 10px 0; }
        
        /* BADGES */
        .badge { padding: 4px 12px; border-radius: 4px; font-size: 0.75rem; font-weight: 800; margin-bottom: 10px; color: white; display: inline-block;}
        .nm-minus { background: var(--nm-minus-grad); animation: pulse 2s infinite; }
        .nm-plain { background: var(--nm-plain); }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

        /* BUTTONS */
        button.buy { 
            width: 100%; padding: 12px; background: transparent; color: #ff8c00; border: 2px solid #ff8c00; 
            border-radius: 8px; font-family: 'Orbitron'; font-weight: bold; cursor: pointer; margin-top: 15px;
        }
        button.buy:hover { background: #ff8c00; color: #000; box-shadow: 0 0 20px #ff8c00; }

        /* MODAL & ZOOM */
        .modal { display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); overflow-y: auto; }
        .modal-content { background: #0a0a0a; margin: 2% auto; padding: 30px; width: 90%; max-width: 900px; border-radius: 15px; border: 1px solid #333; position: relative; }
        .close { position: absolute; right: 20px; top: 15px; font-size: 35px; color: white; cursor: pointer; }
        .zoom-box { width: 100%; height: 450px; overflow: hidden; border-radius: 15px; background: #000; position: relative; cursor: crosshair; }
        .zoom-box img { width: 100%; height: 100%; object-fit: contain; transition: transform 0.1s; }

        .qty-input { background: #222; color: #fff; border: 1px solid var(--neon-btn); padding: 5px; width: 60px; text-align: center; }

        /* MARQUEE */
        .trust-marquee { background: #000; border-top: 1px solid var(--neon-blue); border-bottom: 1px solid var(--neon-blue); padding: 10px 0; overflow: hidden; white-space: nowrap; margin: 40px 0; }
        .marquee-content { display: inline-block; animation: walk 20s linear infinite; font-family: 'Orbitron'; color: var(--neon-blue); }
        @keyframes walk { from { transform: translateX(100%); } to { transform: translateX(-100%); } }
    </style>
</head>
<body>

<div class="cod-bar">⚡ Cash on Delivery (COD) Available Pan-India ⚡</div>

<div class="cart-icon-container" onclick="toggleCart()">
    <span style="font-size: 24px;">🛒</span>
    <div class="cart-count" id="cartCount">0</div>
</div>

<div class="header"><h1>PokeIndia TCG</h1></div>

<div class="nav-buttons">
    <button onclick="changeCategory('all')">ALL</button>
    <button onclick="changeCategory('booster')">BOOSTER BOXES</button>
    <button onclick="changeCategory('packs')">LOOSE PACKS</button>
    <button onclick="changeCategory('cards')">SINGLE CARDS</button>
</div>

<div class="container" id="productList">Loading inventory...</div>

<div id="productModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <div id="modalBody" style="display: flex; flex-wrap: wrap; gap: 30px;"></div>
    </div>
</div>

<div id="cartModal" class="modal">
    <div class="modal-content" style="max-width: 500px;">
        <span class="close" onclick="toggleCart()">&times;</span>
        <h2 style="font-family: 'Orbitron'; color: var(--neon-btn);">Your Inventory</h2>
        <div id="cartList">Inventory is empty</div>
        <div id="cartTotal" style="margin-top: 20px;"></div>
        <button class="checkout-btn" style="background:#25d366; color:white; width:100%; padding:15px; border:none; border-radius:5px; font-weight:bold; cursor:pointer;" onclick="checkout()">Checkout via WhatsApp</button>
    </div>
</div>

<div class="trust-marquee">
    <div class="marquee-content">
        <span>🛡️ 100% Authentic Pokémon Cards Guaranteed &nbsp;&nbsp;&nbsp;&nbsp;</span>
        <span>📦 Secure Bubble-Wrap Packaging &nbsp;&nbsp;&nbsp;&nbsp;</span>
        <span>📑 Tracking ID Shared within 24 Hours &nbsp;&nbsp;&nbsp;&nbsp;</span>
        <span>🚚 Reliable Pan-India Shipping &nbsp;&nbsp;&nbsp;&nbsp;</span>
    </div>
</div>

<script>
const _supabase = supabase.createClient('https://tyxftjhxzypuugwbvoxf.supabase.co', 'YOUR_SUPABASE_ANON_KEY');

let allProducts = [];
let cart = [];
let currentCategory = 'all';

async function fetchProducts() {
    const { data, error } = await _supabase.from('products').select('*');
    if (error) return console.error(error);
    allProducts = data;
    render();
}

function render() {
    if (!allProducts || allProducts.length === 0) {
        document.getElementById("productList").innerHTML = "No products found in database.";
        return;
    }

    let filtered = currentCategory === 'all' ? allProducts : allProducts.filter(p => p.category === currentCategory);
    let html = "";
    
    filtered.forEach(p => {
        const isCard = p.category === 'cards';
        const isNMMinus = (p.name && p.name.includes('NM-')) || p.condition === 'NM-';
        const badge = isCard ? (isNMMinus ? `<div class="badge nm-minus">NM-</div>` : `<div class="badge nm-plain">NM</div>`) : '';
        
        // --- MATCHING YOUR SUPABASE COLUMN NAME ---
        const stockCount = p.maxqty || 1; 
        
        const stockLabel = !isCard ? `<div style="color: #00f3ff; font-size: 0.8rem; margin-top: 5px; font-family: 'Orbitron';">Stock: ${stockCount} available</div>` : '';
        
        const qtyHtml = !isCard ? `
            <div style="margin-top:10px;">
                <input type="number" id="qty-${p.id}" class="qty-input" value="1" min="1" max="${stockCount}">
                ${stockLabel}
            </div>` : '';

        html += `
        <div class="product">
            ${badge}
            <img src="${p.image_url}" onclick="openProduct(${p.id})">
            <h4 style="font-family:'Poppins'; margin: 10px 0;">${p.name}</h4>
            <div class="price-tag">₹${p.price}</div>
            ${qtyHtml}
            <button class="buy" onclick="addToCart(${p.id})">Add to Cart</button>
        </div>`;
    });
    document.getElementById("productList").innerHTML = html;
}
function openProduct(id) {
    const p = allProducts.find(x => x.id === id);
    const body = document.getElementById("modalBody");
    body.innerHTML = `
        <div style="flex:1; min-width:300px;">
            <div class="zoom-box" onmousemove="handleZoom(event)" onmouseleave="resetZoom(event)">
                <img src="${p.image_url}">
            </div>
        </div>
        <div style="flex:1; min-width:300px;">
            <h2 style="font-family:'Orbitron'">${p.name}</h2>
            <div class="price-tag" style="font-size:3rem">₹${p.price}</div>
            <button class="buy" style="height:60px; background:var(--neon-btn); color:black;" onclick="addToCart(${p.id}); closeModal()">Reserve Item</button>
        </div>`;
    document.getElementById("productModal").style.display = "block";
}

function addToCart(id) {
    const p = allProducts.find(x => x.id === id);
    const qInput = document.getElementById(`qty-${id}`);
    const q = qInput ? parseInt(qInput.value) : 1;
    for(let i=0; i<q; i++) cart.push({...p});
    document.getElementById("cartCount").innerText = cart.length;
}

function toggleCart() {
    const modal = document.getElementById("cartModal");
    const list = document.getElementById("cartList");
    const total = document.getElementById("cartTotal");
    if(cart.length === 0) { list.innerHTML = "Empty"; total.innerHTML = ""; }
    else {
        list.innerHTML = cart.map((item, i) => `<div class="cart-item"><span>${item.name}</span><span>₹${item.price} <button onclick="removeFromCart(${i})" style="color:red; background:none; border:none; cursor:pointer;">[X]</button></span></div>`).join('');
        const sub = cart.reduce((a, b) => a + b.price, 0);
        total.innerHTML = `<p>Prepaid: ₹${sub + 150}</p><p>COD: ₹${sub + 250}</p>`;
    }
    modal.style.display = modal.style.display === "block" ? "none" : "block";
}

function removeFromCart(i) { cart.splice(i, 1); document.getElementById("cartCount").innerText = cart.length; toggleCart(); toggleCart(); }
function handleZoom(e) { const img = e.currentTarget.querySelector('img'); const rect = e.currentTarget.getBoundingClientRect(); const x = ((e.clientX - rect.left) / rect.width) * 100; const y = ((e.clientY - rect.top) / rect.height) * 100; img.style.transformOrigin = `${x}% ${y}%`; img.style.transform = "scale(2.5)"; }
function resetZoom(e) { e.currentTarget.querySelector('img').style.transform = "scale(1)"; }
function closeModal() { document.getElementById("productModal").style.display = "none"; }
function changeCategory(cat) { currentCategory = cat; render(); }
function checkout() {
    const sub = cart.reduce((a, b) => a + b.price, 0);
    const msg = `Hi PokeIndia, I want:\n${cart.map(i => `- ${i.name}`).join("\n")}\n\nPrepaid: ₹${sub+150}\nCOD: ₹${sub+250}`;
    window.open("https://wa.me/7976132992?text=" + encodeURIComponent(msg));
}
fetchProducts();
</script>
</body>
</html>
