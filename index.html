function openProduct(index) {
    const p = products[index];

    console.log("OPENED PRODUCT:", p);
console.log("FULL IMAGES:", p.fullImages);
console.log("IMAGE COUNT:", p.fullImages ? p.fullImages.length : 0);
    const body = document.getElementById("modalBody");

    const images = p.fullImages || [];

    body.innerHTML = `
<div style="display:flex; gap:20px; flex-wrap:wrap;">

    <!-- LEFT SIDE -->
    <div style="flex:1; min-width:300px;">
        <div class="zoom-box"
            onmousemove="handleZoom(event)"
            onmouseleave="resetZoom(event)">

            <img src="${images[0] || p.thumbnail || (p.images && p.images[0])}" id="zoomImg">

            ${Array.isArray(images) && images.length > 1 ? `
                <div style="margin-top:10px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
                    ${images.map(img => `
                        <img src="${img}"
    onclick="document.getElementById('zoomImg').src='${img}'"
    onmouseenter="window.disableZoom = true"
    onmouseleave="window.disableZoom = false"
                            style="width:60px;height:60px;object-fit:cover;border:1px solid #fff;cursor:pointer;border-radius:6px;">
                    `).join("")}
                </div>
            ` : ""}

        </div>
    </div>

    <!-- RIGHT SIDE -->
    <div style="flex:1; min-width:300px;">
        <h2 style="font-family:'Orbitron'">${p.name}</h2>

        <div class="price-tag" style="font-size:3rem">
            ₹${p.price}
        </div>

        ${p.ripPrice ? `
            <div style="color:#39ff14;font-family:'Orbitron';margin-top:10px;">
                RIP Price: ₹${p.ripPrice}
            </div>
        ` : ""}

        <button class="buy"
            style="height:60px; background:var(--neon-btn); color:black;"
            onclick="addToCart(${index}); closeModal()">
            Reserve Item
        </button>
    </div>

</div>
`;

    document.getElementById("productModal").style.display = "block";
    document.body.style.overflow = "hidden";
}
function addToCartRip(index) {
    const p = {...products[index]}; 
    p.name = p.name + " (RIP & SHIP)"; 
    p.price = p.ripPrice; 
    cart.push(p);
    document.getElementById("cartCount").innerText = cart.length;
    alert("Added Rip & Ship to cart!");
}
function addToCart(index) {
    const p = products[index];
    const qInput = document.getElementById(`qty-${index}`);
    const q = qInput ? parseInt(qInput.value) : 1;
    for(let i=0; i<q; i++) cart.push({...p});
    document.getElementById("cartCount").innerText = cart.length;
}

function toggleCart() {
    const modal = document.getElementById("cartModal");
    const list = document.getElementById("cartList");
    const total = document.getElementById("cartTotal");
    if(cart.length === 0) { list.innerHTML = "Empty"; total.innerHTML = ""; }
    else {
        list.innerHTML = cart.map((item, i) => `<div class="cart-item"><span>${item.name}</span><span>₹${item.price} <button onclick="removeFromCart(${i})" style="color:red; background:none; border:none; cursor:pointer;">[X]</button></span></div>`).join('');
        const sub = cart.reduce((a, b) => a + b.price, 0);
        total.innerHTML = `<p style="color:#00f3ff">Prepaid Total: ₹${sub + 150}</p><p style="color:#ffcb05">COD Total: ₹${sub + 250}</p>`;
    }
    modal.style.display = modal.style.display === "block" ? "none" : "block";
}

function removeFromCart(i) { cart.splice(i, 1); document.getElementById("cartCount").innerText = cart.length; toggleCart(); toggleCart(); }
function closeModal() { document.getElementById("productModal").style.display = "none"; document.body.style.overflow = "auto"; }
function changeCategory(cat) { currentCategory = cat; render(); }
    let currentCategory = "all";
let cart = [];
function handleZoom(e) { if (window.disableZoom) return;
    const box = e.currentTarget;
    const img = box.querySelector('img');
    const rect = box.getBoundingClientRect();
    const x = ((e.clientX - rect.left) / rect.width) * 100;
    const y = ((e.clientY - rect.top) / rect.height) * 100;
    img.style.transformOrigin = `${x}% ${y}%`;
    img.style.transform = "scale(2.5)";
}
function resetZoom(e) { e.currentTarget.querySelector('img').style.transform = "scale(1)"; }
function render() {

    const container = document.getElementById("productContainer");
console.log("RENDER PRODUCTS:", products);
    let filtered = [...products];

    // CATEGORY FILTER
    if (currentCategory !== "all") {
        filtered = filtered.filter(p => p.category === currentCategory);
    }

    // STOCK FILTER
    const stockFilter = document.getElementById("stockFilter").value;

    if (stockFilter === "in-stock") {
        filtered = filtered.filter(p => !p.soldOut);
    }

    if (stockFilter === "out-of-stock") {
        filtered = filtered.filter(p => p.soldOut);
    }
// PRICE SORTING
const sortValue = document.getElementById("sortSelect").value;

if (sortValue === "priceLow") {
    filtered.sort((a, b) => a.price - b.price);
}

if (sortValue === "priceHigh") {
    filtered.sort((a, b) => b.price - a.price);
}
    container.innerHTML = filtered.map((p) => `
        <div class="product">

            <div class="img-container">

                <img 
    src="${p.thumbnail || p.images[0]}" 
    loading="lazy"
    onclick="openProduct(${products.indexOf(p)})"
>

                ${p.soldOut ? `
                <div class="sold-overlay">
                    <div class="sold-banner">SOLD OUT</div>
                </div>
                ` : ""}

            </div>

            <h3>${p.name}</h3>

            <div class="price-tag">₹${p.price}</div>

            ${
                p.soldOut
                ? `<button class="buy" disabled style="opacity:0.5;">Out of Stock</button>`
                : `<button class="buy" onclick="addToCart(${products.indexOf(p)})">Add to Cart</button>`
            }

        </div>
    `).join("");
}
function checkout() {
    if(cart.length === 0) return;
    const sub = cart.reduce((a, b) => a + b.price, 0);
    const msg = `Hi PokeIndia, I want to order:\n${cart.map(i => `- ${i.name}`).join("\n")}\n\nPrepaid Total: ₹${sub+150}\nCOD Total: ₹${sub+250}\n\nPlease share payment details!`;
    window.open("https://wa.me/7976132992?text=" + encodeURIComponent(msg));
}
function applyFilters() {
    render();
}
render();
